<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bongo Dog</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #bfe8dc;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  /* ---- pastel kawaii room ---- */
  #room { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .wall {
    position: absolute; left: 0; right: 0; top: 0; height: 62%;
    background-color: #bfe8dc;
    background-image:
      radial-gradient(circle, #fff 0 5px, transparent 6px),
      radial-gradient(circle, #fff 0 5px, transparent 6px);
    background-size: 60px 60px;
    background-position: 0 0, 30px 30px;
  }
  .baseboard {
    position: absolute; left: 0; right: 0; top: 62%; height: 12px;
    background: #fff; border-bottom: 3px solid #f4c6d4;
  }
  .floor {
    position: absolute; left: 0; right: 0; top: calc(62% + 15px); bottom: 0;
    background: repeating-linear-gradient(90deg, #fbdde6 0 140px, #f6cfdb 140px 143px);
  }
  .bunting {
    position: absolute; top: 0; left: 0; right: 0; height: 46px;
    background:
      conic-gradient(from 150deg at 50% 0, #ffb3c7 0 60deg, transparent 0) 0 0 / 80px 46px repeat-x,
      conic-gradient(from 150deg at 50% 0, #ffe08a 0 60deg, transparent 0) 40px 0 / 80px 46px repeat-x;
  }
  .window {
    position: absolute; top: 14%; left: 8%; width: 190px; height: 150px;
    background: linear-gradient(#a8dcff, #e6f6ff);
    border: 12px solid #fff; border-radius: 90px 90px 14px 14px;
    box-shadow: 0 5px 0 #f4c6d4; overflow: hidden;
  }
  .window::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; background: #fff; transform: translateX(-50%); }
  .cloud { position: absolute; width: 60px; height: 22px; background: #fff; border-radius: 20px; }
  .cloud::before { content: ""; position: absolute; width: 30px; height: 30px; left: 10px; top: -14px; background: #fff; border-radius: 50%; }
  .c1 { top: 40px; left: 18px; }
  .c2 { top: 85px; left: 95px; transform: scale(0.8); }
  .frame {
    position: absolute; top: 16%; right: 10%; width: 110px; height: 110px;
    background: #fff; border: 8px solid #ffb3c7; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 44px;
    box-shadow: 0 4px 0 #f4c6d4;
  }
  .star { position: absolute; color: #ffe08a; font-size: 26px; text-shadow: 0 2px 0 #f5c94a; }
  .s1 { top: 12%; left: 32%; } .s2 { top: 34%; right: 28%; font-size: 20px; } .s3 { top: 44%; left: 22%; font-size: 18px; }
  .bed {
    position: absolute; left: 4%; top: calc(62% + 40px); width: 170px; height: 70px;
    background: #ffb3c7; border-radius: 60px 60px 30px 30px;
    box-shadow: inset 0 -16px 0 #ff9ab5;
  }
  .bed::after { content: ""; position: absolute; left: 22px; right: 22px; top: 14px; height: 34px; background: #fff3f7; border-radius: 30px; }
  .rug {
    position: absolute; width: 700px; height: 120px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(#d9c7ff 0 55%, #fff 55% 62%, #d9c7ff 62% 100%);
    box-shadow: 0 0 0 8px #e9dcff;
  }

  /* ---- launcher ---- */
  #launcher {
    position: absolute; z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #6b3e1f;
    background: rgba(255, 248, 238, 0.94);
    padding: 24px 40px; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  #launcher h1 { margin: 0 0 18px; font-size: 32px; }
  #startBtn {
    font-size: 22px; font-weight: bold;
    padding: 10px 40px;
    border: none; border-radius: 12px;
    background: #e74c3c; color: white;
    cursor: pointer;
  }
  #startBtn:hover { background: #c0392b; }
  #qp { margin-top: 16px; font-size: 24px; font-weight: bold; }
  #mood { font-size: 16px; margin-top: 2px; }
  .tip { margin-top: 10px; font-size: 13px; color: #a07050; max-width: 320px; }
  body.playing #launcher { top: 60px; transform: translateX(-50%); padding: 8px 28px; }
  body.playing #launcher h1, body.playing #startBtn, body.playing .tip { display: none; }
  body.playing #qp { margin-top: 0; }
  body:not(.playing) #mood { display: none; }

  /* ---- drums (drawn with code) ---- */
  .drum { position: absolute; display: none; cursor: pointer; transform-origin: 50% 100%; }
  .drum svg { display: block; width: 100%; height: 100%; overflow: visible; }
  body.playing .drum { display: block; }
  .drum.hit { animation: squish 0.15s ease-out; }
  @keyframes squish { 50% { transform: scale(1.08, 0.88); } }
  .back  { z-index: 2; }
  .front { z-index: 4; }
  .pop {
    position: absolute; z-index: 6; pointer-events: none;
    font-size: 30px; font-weight: 900; color: #ffb000;
    text-shadow: 0 2px 0 #fff;
    animation: pop 0.5s ease-out forwards;
  }
  @keyframes pop { from { opacity: 1; transform: translate(-50%, 0) scale(0.6); } to { opacity: 0; transform: translate(-50%, -50px) scale(1.2); } }

  /* ---- the dog: one square from the 5x4 sheet ---- */
  #dog {
    position: absolute; z-index: 3;
    width: 240px; height: 200px;
    display: none; cursor: grab; touch-action: none;
  }
  #dogImg {
    width: 100%; height: 100%;
    background: url("art/dog-sheet.png") no-repeat;
    background-size: 1200px 800px;   /* 5 x 240, 4 x 200 */
    transform-origin: 50% 100%;
    transition: transform 0.08s;
    clip-path: inset(1% 3% 0 4%);   /* hide bits of the neighbor stickers */
  }
  #dog.held { cursor: grabbing; z-index: 7; }
  #dog.held #dogImg { transform: scale(1.08) rotate(-4deg); }

  /* right-click menu */
  #menu {
    position: absolute; display: none; z-index: 20;
    background: white; border: 1px solid #ccc; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    padding: 4px 0; font-size: 15px;
  }
  #menu div { padding: 6px 24px; cursor: pointer; }
  #menu div:hover { background: #ffe0cc; }
</style>
</head>
<body>
  <div id="room">
    <div class="wall"></div>
    <div class="bunting"></div>
    <div class="window"><div class="cloud c1"></div><div class="cloud c2"></div></div>
    <div class="frame">🐾</div>
    <div class="star s1">★</div><div class="star s2">★</div><div class="star s3">★</div>
    <div class="baseboard"></div>
    <div class="floor"></div>
    <div class="bed"></div>
    <div class="rug" id="rug"></div>
  </div>

  <div id="launcher">
    <h1>Bongo Dog 🐶</h1>
    <button id="startBtn">START</button>
    <div id="qp">QP: 0</div>
    <div id="mood">😊 normal</div>
    <div class="tip">Type to drum · type a feeling like <b>happy</b>, <b>sad</b> or <b>angry</b> · click the dog for a beat · click a drum · drag the dog · right-click to quit</div>
  </div>

  <!-- big pink bass drum (back left) -->
  <div class="drum back" id="bass" style="width:130px;height:130px">
    <svg viewBox="0 0 130 130"><g stroke="#4a3328" stroke-width="5" stroke-linejoin="round">
      <line x1="30" y1="112" x2="18" y2="128"/><line x1="100" y1="112" x2="112" y2="128"/>
      <circle cx="65" cy="62" r="58" fill="#ffb3c7"/>
      <circle cx="65" cy="62" r="42" fill="#fff3f7"/>
      <path d="M65 80 C40 62 50 44 65 56 C80 44 90 62 65 80 Z" fill="#ff8fb0" stroke-width="4"/>
    </g></svg>
  </div>

  <!-- brown bongos (front left) -->
  <div class="drum front" id="bongos" style="width:150px;height:110px">
    <svg viewBox="0 0 150 110"><g stroke="#4a3328" stroke-width="5" stroke-linejoin="round">
      <rect x="66" y="58" width="18" height="14" rx="4" fill="#ffd27a"/>
      <path d="M10 30 L18 104 L62 104 L70 30 Z" fill="#c98a55"/>
      <ellipse cx="40" cy="30" rx="31" ry="11" fill="#fff1dc"/>
      <path d="M82 42 L89 104 L128 104 L136 42 Z" fill="#b87645"/>
      <ellipse cx="109" cy="42" rx="28" ry="10" fill="#fff1dc"/>
    </g></svg>
  </div>

  <!-- red snare with gold zigzag (front right) -->
  <div class="drum front" id="snare" style="width:140px;height:100px">
    <svg viewBox="0 0 140 100"><g stroke="#4a3328" stroke-width="5" stroke-linejoin="round">
      <rect x="10" y="28" width="120" height="58" rx="10" fill="#e5534b"/>
      <polyline points="14,36 34,78 54,36 74,78 94,36 114,78 128,40" fill="none" stroke="#ffd54a" stroke-width="5"/>
      <rect x="8" y="80" width="124" height="12" rx="6" fill="#ffd54a"/>
      <ellipse cx="70" cy="28" rx="61" ry="14" fill="#fff1dc"/>
    </g></svg>
  </div>

  <!-- yellow cymbal on a stand (back right) -->
  <div class="drum back" id="cymbal" style="width:110px;height:150px">
    <svg viewBox="0 0 110 150"><g stroke="#4a3328" stroke-width="5" stroke-linejoin="round">
      <line x1="55" y1="40" x2="55" y2="140"/>
      <line x1="55" y1="140" x2="30" y2="148"/><line x1="55" y1="140" x2="80" y2="148"/>
      <ellipse cx="55" cy="36" rx="50" ry="14" fill="#ffd54a" transform="rotate(-8 55 36)"/>
      <circle cx="55" cy="34" r="6" fill="#ffecb0"/>
    </g></svg>
  </div>

  <div id="dog"><div id="dogImg"></div></div>
  <div id="menu"><div id="quitBtn">Quit</div></div>

<script>
  // ---------- settings ----------
  const DOG_W = 240, DOG_H = 200;
  const SLEEP_AFTER = 10000;  // ms without typing before he sleeps
  const DRAG_START = 6;       // px before a click turns into a drag
  const WALK_SPEED = 220;     // px per second when walking home

  // where each pose is in the 5x4 sheet: [column, row]
  const POSES = {
    normal: [0, 0], walk: [2, 0],
    happy: [0, 1], sad: [1, 1], angry: [2, 1], scared: [3, 1], confused: [4, 1],
    shy: [0, 2], love: [1, 2], sleepy: [2, 2], surprised: [3, 2],
    laugh: [1, 3], excited: [2, 3], grumpy: [3, 3], cry: [4, 3],
  };
  // words you can type -> mood
  const WORDS = {
    happy: "happy", sad: "sad", angry: "angry", mad: "angry", scared: "scared",
    confused: "confused", shy: "shy", love: "love", sleepy: "sleepy", tired: "sleepy",
    surprised: "surprised", laugh: "laugh", funny: "laugh", excited: "excited",
    grumpy: "grumpy", cry: "cry", normal: "normal", calm: "normal",
  };
  const MOOD_EMOJI = {
    normal: "😊", happy: "😄", sad: "💔", angry: "💢", scared: "😨", confused: "❓",
    shy: "☺️", love: "💕", sleepy: "💤", surprised: "😮", laugh: "😆",
    excited: "✨", grumpy: "😒", cry: "😭",
  };
  // the click beat: "bom-bom-ba-BOM!" [drum, lean, ms]
  const BEAT = [
    ["bongos", -1, 260],
    ["snare",   1, 260],
    ["bongos", -1, 170],
    ["bass",   -1, 0],
    ["cymbal",  1, 420],
  ];

  // ---------- elements ----------
  const dog = document.getElementById("dog");
  const dogImg = document.getElementById("dogImg");
  const startBtn = document.getElementById("startBtn");
  const qpEl = document.getElementById("qp");
  const moodEl = document.getElementById("mood");
  const menu = document.getElementById("menu");
  const rug = document.getElementById("rug");
  const drums = {
    bass: document.getElementById("bass"),
    bongos: document.getElementById("bongos"),
    snare: document.getElementById("snare"),
    cymbal: document.getElementById("cymbal"),
  };

  // ---------- state ----------
  let running = false, busy = false, dragging = false, walking = false, sleeping = false;
  let qp = 0, mood = "normal", nextSide = -1, lastActive = Date.now(), leanTimer = null;
  let homeX = 0, homeY = 0, dogX = 0, dogY = 0, press = null, audio = null;
  let letters = "";  // last few letters, only kept in memory to spot feeling words

  // ---------- drawing the dog ----------
  function setPose(name, flip = false, lean = 0, lift = 0) {
    const [c, r] = POSES[name];
    dogImg.style.backgroundPosition = `${-c * DOG_W}px ${-r * DOG_H}px`;
    dogImg.style.transform = `translateY(${-lift}px) rotate(${lean}deg) scaleX(${flip ? -1 : 1})`;
  }
  function restPose() {
    if (dragging || walking) return;
    setPose(sleeping ? "sleepy" : mood);
  }
  function moveDog(x, y) {
    dogX = x; dogY = y;
    dog.style.left = x + "px"; dog.style.top = y + "px";
  }

  // ---------- layout: dog in the middle on the rug, drums around him ----------
  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    const cx = W / 2, floorY = Math.max(DOG_H + 120, H * 0.82);
    homeX = cx - DOG_W / 2;
    homeY = floorY - DOG_H;
    rug.style.left = cx + "px";
    rug.style.top = (floorY - 10) + "px";
    place("bass",   cx - 265, floorY - 5);
    place("bongos", cx - 135, floorY + 20);
    place("snare",  cx + 135, floorY + 20);
    place("cymbal", cx + 265, floorY - 5);
  }
  function place(name, centerX, bottomY) {
    const d = drums[name];
    d.style.left = (centerX - parseInt(d.style.width) / 2) + "px";
    d.style.top = (bottomY - parseInt(d.style.height)) + "px";
  }

  // ---------- sounds (made by the browser, no files) ----------
  function ctx() { if (!audio) audio = new AudioContext(); return audio; }
  function tone(pitch, length, volume) {
    const a = ctx(), now = a.currentTime;
    const osc = a.createOscillator(), gain = a.createGain();
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, now + length * 0.6);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + length);
    osc.connect(gain).connect(a.destination);
    osc.start(now); osc.stop(now + length);
  }
  function noise(length, volume, filterType, freq) {
    const a = ctx(), now = a.currentTime;
    const buf = a.createBuffer(1, a.sampleRate * length, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), filter = a.createBiquadFilter(), gain = a.createGain();
    src.buffer = buf;
    filter.type = filterType; filter.frequency.value = freq;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + length);
    src.connect(filter).connect(gain).connect(a.destination);
    src.start(now);
  }
  const DRUM_SOUND = {
    bongos: () => tone(nextSide < 0 ? 300 : 230, 0.25, 0.7),
    snare:  () => { noise(0.18, 0.5, "bandpass", 1800); tone(200, 0.12, 0.4); },
    bass:   () => tone(95, 0.55, 1.0),
    cymbal: () => noise(0.9, 0.35, "highpass", 6000),
  };

  // ---------- hitting a drum ----------
  function hitDrum(name, withSound) {
    const d = drums[name];
    d.classList.remove("hit"); void d.offsetWidth; d.classList.add("hit");
    if (withSound) DRUM_SOUND[name]();
    const p = document.createElement("div");
    p.className = "pop";
    p.textContent = name === "cymbal" ? "✦" : "!";
    p.style.left = (d.offsetLeft + d.offsetWidth / 2) + "px";
    p.style.top = (d.offsetTop - 20) + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
  // dog leans toward a side (-1 left, 1 right) and bounces
  function lean(side) {
    if (dragging || walking) return;
    setPose(sleeping ? "sleepy" : mood, false, side * 10, 10);
    clearTimeout(leanTimer);
    leanTimer = setTimeout(restPose, 110);
  }

  function wake() {
    lastActive = Date.now();
    if (sleeping) { sleeping = false; restPose(); }
  }

  function setMood(m) {
    mood = m;
    moodEl.textContent = `${MOOD_EMOJI[m]} ${m}`;
    sleeping = (m === "sleepy");
    lastActive = Date.now();
    restPose();
  }

  // ---------- START / Quit ----------
  startBtn.addEventListener("click", () => {
    running = true; busy = false; dragging = false; walking = false; sleeping = false;
    qp = 0; qpEl.textContent = "QP: 0";
    letters = "";
    document.body.classList.add("playing");
    layout();
    moveDog(homeX, homeY);
    dog.style.display = "block";
    setMood("normal");
    lastActive = Date.now();
    startBtn.blur();
  });

  document.getElementById("quitBtn").addEventListener("click", () => {
    menu.style.display = "none";
    running = false;
    dog.style.display = "none";
    document.body.classList.remove("playing");
  });

  // ---------- typing: drums + feeling words ----------
  document.addEventListener("keydown", (e) => {
    if (!running || e.repeat) return;
    qp++; qpEl.textContent = "QP: " + qp;

    // spot feeling words (letters stay in memory only, never saved)
    if (/^[a-z]$/i.test(e.key)) {
      letters = (letters + e.key.toLowerCase()).slice(-10);
      for (const w in WORDS) {
        if (letters.endsWith(w)) { setMood(WORDS[w]); letters = ""; break; }
      }
    }

    if (mood !== "sleepy") wake();
    if (busy || dragging || walking) return;
    hitDrum(nextSide < 0 ? "bongos" : "snare", false);  // typing is quiet
    lean(nextSide);
    nextSide = -nextSide;
  });

  // ---------- falls asleep ----------
  setInterval(() => {
    if (running && !busy && !dragging && !walking && !sleeping && Date.now() - lastActive > SLEEP_AFTER) {
      sleeping = true; restPose();
    }
  }, 500);

  // ---------- click beat ----------
  function playBeat(i) {
    if (!running) return;
    if (i === BEAT.length) {
      setPose("excited");  // ta-da!
      setTimeout(() => { busy = false; restPose(); lastActive = Date.now(); }, 800);
      return;
    }
    busy = true;
    const [name, side, wait] = BEAT[i];
    hitDrum(name, true);
    setPose(mood === "sleepy" ? "happy" : mood, false, side * 10, 10);
    setTimeout(() => playBeat(i + 1), wait);
  }

  // click a drum yourself
  for (const name in drums) {
    drums[name].addEventListener("click", () => { if (running) { hitDrum(name, true); wake(); } });
  }

  // ---------- pick up the dog, he walks back ----------
  dog.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || walking) return;
    dog.setPointerCapture(e.pointerId);
    press = { x: e.clientX, y: e.clientY, offX: e.clientX - dogX, offY: e.clientY - dogY };
  });

  dog.addEventListener("pointermove", (e) => {
    if (!press) return;
    if (!dragging) {
      if (Math.abs(e.clientX - press.x) < DRAG_START && Math.abs(e.clientY - press.y) < DRAG_START) return;
      if (busy) return;
      dragging = true; wake();
      dog.classList.add("held");
      setPose("surprised");  // whoa, picked up!
      dogImg.style.transform = "";
    }
    moveDog(e.clientX - press.offX, e.clientY - press.offY);
  });

  dog.addEventListener("pointerup", () => {
    if (!press) return;
    press = null;
    if (dragging) {
      dragging = false;
      dog.classList.remove("held");
      walkHome();
    } else if (!busy) {
      wake(); playBeat(0);
    }
  });

  function walkHome() {
    walking = true;
    let last = performance.now(), t = 0;
    function step(now) {
      if (!running) { walking = false; return; }
      const dt = (now - last) / 1000; last = now; t += dt;
      const dx = homeX - dogX, dy = homeY - dogY;
      const dist = Math.hypot(dx, dy);
      if (dist < 3) {
        moveDog(homeX, homeY);
        walking = false; lastActive = Date.now();
        restPose();
        return;
      }
      const move = Math.min(dist, WALK_SPEED * dt);
      moveDog(dogX + dx / dist * move, dogY + dy / dist * move);
      // walking pose faces right in the picture, so flip it when going left
      const bob = Math.abs(Math.sin(t * 12)) * 8;
      setPose("walk", dx < 0, Math.sin(t * 12) * 3, bob);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- right-click menu ----------
  dog.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    menu.style.left = e.clientX + "px";
    menu.style.top = e.clientY + "px";
    menu.style.display = "block";
  });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) menu.style.display = "none"; });

  window.addEventListener("resize", () => {
    if (!running) return;
    layout();
    if (!dragging && !walking) moveDog(homeX, homeY);
  });
  layout();
</script>
</body>
</html>
